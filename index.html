<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Ödeme Planı"><meta name="theme-color" content="#f5f7fa"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Ödeme ve Gelir Listesi</title>

<style id="app-style">
/* Layout: one narrow ledger column; month tabs on top, each row = tick · date · what · amount; add forms open as panels */
:root{

}

  --accent:#7d9cff; --on-accent:#0f141b; --in:#4cc99a; --in-bg:#123328; --out:#ff8a73; --out-bg:#3a1d17;

:root[data-theme="dark"]{

  --accent:#7d9cff; --on-accent:#0f141b; --in:#4cc99a; --in-bg:#123328; --out:#ff8a73; --out-bg:#3a1d17;
  --card:#ab98ff; --card-bg:#251f40; --warn:#f2b45a; --warn-bg:#3a2a10; color-scheme:dark}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 104px;display:flex;flex-direction:column;gap:18px}

.next-row b.in{color:var(--in)} .next-row b.out{color:var(--out)} .next-row b.card{color:var(--card)}

.filters{display:flex;gap:6px;flex-wrap:wrap}

.row .what{min-width:0}

.row .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .amt{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}

.row.done .lbl,.row.done .amt{text-decoration:line-through;opacity:.55}
.row.done .note{opacity:.55}
.empty{color:var(--muted);padding:12px 0;font-size:.9rem}
.foot{color:var(--muted);font-size:.8rem;max-width:65ch}
/* add panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.panel h2{font-family:var(--font-display);font-size:1.15rem;margin:0;display:flex;align-items:center;gap:8px}

.check{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}

.panel-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* timeline tab: always light, per the owner's request */
.tl{--t-bg:#ffffff;--t-fg:#1f2328;--t-mu:#5d6878;--t-line:#e3e7ec;--t-in:#11845b;--t-out:#c2412d;--t-card:#6a4fd1;background:var(--t-bg);color:var(--t-fg);border:1px solid #d0d7de;border-radius:14px;padding:6px 12px 10px;color-scheme:light}

.tl-r.ek{background:#fdecd2} .tl-r.gap{background:#fbe0db} .tl-r.loan{background:#dff3e9} .tl-r.start{background:#e3eefc}

/* confirm dialog */
.cf-back{position:fixed;inset:0;z-index:60;background:rgba(15,20,27,.5);display:grid;place-items:center;padding:16px}
.cf{box-sizing:border-box;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:18px;width:100%;max-width:460px;max-height:calc(100dvh - 32px);overflow-y:auto;padding:18px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}

<main class="wrap" id="app"><p class="empty">Liste yükleniyor…</p></main>
<script type="application/json" id="state">{"done":[],"custom":[],"cards":{},"loans":[],"edits":{}}</script>
<script id="app-script">
(function(){
let BASE=[];
// Card-limit openings (payments into usable cards; Garanti card is not usable) and the cash part of split card items
const LIM={};
const CASH={};
BASE.forEach(i=>{if(LIM[i.id]!=null)i.lim=LIM[i.id];if(CASH[i.id]!=null)i.cash=CASH[i.id]});

const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const AYS=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const STASH="odeme-listesi-pending-v2";
let state={done:[],custom:[]};
try{state=Object.assign(state,JSON.parse(document.getElementById("state").textContent)||{})}catch(e){}
let done=new Set(state.done||[]);
let custom=Array.isArray(state.custom)?state.custom:[];
let cards=state.cards&&typeof state.cards==="object"?state.cards:{};
let loans=Array.isArray(state.loans)?state.loans:[];
let edits=state.edits&&typeof state.edits==="object"&&!Array.isArray(state.edits)?state.edits:{};
let editId=null, editForm={}, editDel=false, drag=null, suppressClick=false, chatOpen=false, flashId=null;
let sampleChecked=false;
let view="plan", cardTab="akbank", busy=null, sampleFn=null, pdfReady=null, ctl=null, cardDel=null;
let filter="all", month=null, mode="loading", chipText="Hazırlanıyor", timer=null, art=null;
let panel=null, delArm=null;
let form={};
const app=document.getElementById("app");

const fmt=n=>Math.round(n).toLocaleString("tr-TR")+" ₺";
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=iso(new Date());
const dlabel=s=>{const[,m,d]=s.split("-");return +d+" "+AYS[+m-1]};
const mlabel=k=>{const[y,m]=k.split("-");return AYLAR[+m-1]+(y!=="2026"&&+m>2?" "+y:"")};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function addMonths(s,n){const[y,m,d]=s.split("-").map(Number);const last=new Date(y,m-1+n+1,0).getDate();return iso(new Date(y,m-1+n,Math.min(d,last)))}
// Base rows carry the user's edits (label, amount, date, order, removal) from the edits map
const applyEdit=i=>edits[i.id]?Object.assign({},i,edits[i.id]):i;
const allItems=()=>BASE.map(applyEdit).concat(custom.map((c,i)=>Object.assign({ord:1000+i,mine:true},c))).filter(i=>!i.removed).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ord-b.ord);
function setPatch(id,p){const c=custom.find(x=>x.id===id);if(c)Object.assign(c,p);else edits[id]=Object.assign({},edits[id]||{},p)}

function readStash(){try{const v=sessionStorage.getItem(STASH)||localStorage.getItem(STASH);return v?JSON.parse(v):null}catch(e){return null}}
function writeStash(){try{const v=JSON.stringify({base:BASE,done:[...done],custom,cards,loans,edits});sessionStorage.setItem(STASH,v);localStorage.setItem(STASH,v)}catch(e){}}
function clearStash(){try{sessionStorage.removeItem(STASH);localStorage.removeItem(STASH)}catch(e){}}
const sameState=(a,b)=>JSON.stringify({d:[...(a.done||[])].sort(),c:a.custom||[],k:a.cards||{},l:a.loans||[],e:a.edits||{}})===JSON.stringify({d:[...(b.done||[])].sort(),c:b.custom||[],k:b.cards||{},l:b.loans||[],e:b.edits||{}});

// ---------- loan math ----------
function loan(P,ratePct,n,tax){
  const r=(ratePct/100)*(tax?1.3:1);
  const pay=r>0?P*r/(1-Math.pow(1+r,-n)):P/n;
  return {pay,total:pay*n,cost:pay*n-P};
}

// ---------- automatic cash / card decision ----------
const EK_HESAP=4000, EK_FROM="2026-12-10";
const cashEff=i=>i.kind==="in"?i.amount:i.kind==="out"?-i.amount:-(i.cash||0);
const limEff=i=>i.lim!=null?i.lim:(i.kind==="card"?-(i.amount-(i.cash||0)):0);
const floorAt=d=>d>=EK_FROM?-EK_HESAP:0;
function sortItems(a){return a.slice().sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(x.ord||0)-(y.ord||0))}
// Spare cash and card limit that stay free from date d onward, so a new payment never breaks a later one
function headroom(d,items){
  let bal=0,lim=0,minCash=Infinity,minLim=Infinity,seen=false;
  for(const i of sortItems(items)){
    if(i.date>=d&&!seen){seen=true;minCash=Math.min(minCash,bal-floorAt(d));minLim=Math.min(minLim,lim)}
    bal+=cashEff(i);lim+=limEff(i);
    if(i.date>=d){minCash=Math.min(minCash,bal-floorAt(i.date));minLim=Math.min(minLim,lim)}
  }
  if(!seen){minCash=bal-floorAt(d);minLim=lim}
  return {cash:Math.max(0,minCash),lim:Math.max(0,minLim)};
}
function decide(d,A,items,cardable){
  const h=headroom(d,items);
  const cash=Math.min(A,h.cash);
  const card=cardable?Math.min(A-cash,h.lim):0;
  return {cash,card,short:Math.max(0,A-cash-card),h};
}
// Builds the rows for one occurrence; ord keeps it after the plan's rows of the same day
function rowsFor(base,dec,cardable){
  const out=[];
  const n=x=>fmt(x);
  if(dec.card<=0){
    out.push(Object.assign({},base,{kind:"out",note:noteJoin(base.note,dec.short>0?`Nakit yetmiyor: ${n(dec.short)} eksik`:"Otomatik: nakitten"),short:dec.short}));
  }else if(dec.cash<=0&&dec.short<=0){
    out.push(Object.assign({},base,{kind:"card",lim:-dec.card,note:noteJoin(base.note,"Otomatik: kartla (o dönem nakit yetmiyor)")}));
  }else{
    if(dec.cash>0)out.push(Object.assign({},base,{kind:"out",amount:dec.cash,label:base.label+" · nakit kısmı",note:noteJoin(base.note,"Otomatik bölündü")}));
    out.push(Object.assign({},base,{kind:"card",amount:dec.card+(dec.short||0),lim:-dec.card,label:base.label+(dec.cash>0?" · kart kısmı":""),note:noteJoin(base.note,dec.short>0?`Kart limiti de yetmiyor: ${n(dec.short)} eksik`:"Otomatik: kartla"),short:dec.short}));
  }
  return out;
}
const noteJoin=(a,b)=>[a,b].filter(Boolean).join(" · ");
// Simulates a series against the plan and returns the rows it would add
function planRows(occ,cardable){
  let work=allItems();const rows=[];
  for(const o of occ){
    const dec=decide(o.date,o.amount,work,cardable);
    const r=rowsFor(o,dec,cardable).map((x,k)=>Object.assign(x,{ord:5000+rows.length+k}));
    rows.push(...r);work=work.concat(r);
  }
  return rows;
}
function summarize(rows){
  const cash=rows.filter(r=>r.kind==="out").reduce((s,r)=>s+r.amount,0);
  const card=rows.filter(r=>r.kind==="card").reduce((s,r)=>s+r.amount-(r.short||0),0);
  const short=rows.reduce((s,r)=>s+(r.short||0),0);
  return {cash,card,short};
}

// ---------- render ----------
function render(){
  if(!BASE.length&&!custom.length){app.innerHTML=`<div class="top"><div><h1>Ödeme Planı</h1><p class="sub">Hoş geldin</p></div></div><div class="panel"><h2>Verilerini yükle</h2><p class="foot" style="margin:0">Claude'un gönderdiği <b>odeme-yedek.json</b> dosyasını seç. Dosyayı önce iPhone'da Dosyalar'a kaydetmen gerekiyor. Veriler sadece bu telefonda tutulur.</p><div class="panel-actions" style="justify-content:flex-start"><button type="button" class="btn primary" id="imp-btn" data-imp="1">Yedek dosyasını seç</button></div><input type="file" id="imp-file" accept="application/json,.json" hidden></div>`;return}
  const items=allItems();
  const months=[...new Set(items.map(i=>i.date.slice(0,7)))];
  if(!month||(month!=="all"&&!months.includes(month))){month=months.find(m=>m===today.slice(0,7))||months[0]}
  const pending=items.filter(i=>!done.has(i.id));
  const upcoming=pending.filter(i=>i.date<=addDays(today,7)).slice(0,6);
  const pct=items.length?Math.round(items.filter(i=>done.has(i.id)).length/items.length*100):0;
  const ins=items.filter(i=>i.kind==="in"), outs=items.filter(i=>i.kind!=="in");
  const sum=a=>a.reduce((s,i)=>s+i.amount,0);
  let h=`<div class="top"><div><h1>Ödeme ve Gelir Listesi</h1><p class="sub">${items.length} kalem · ${mlabel(months[0])} – ${mlabel(months[months.length-1])}</p></div><span class="chip ${mode}" id="chip">${esc(chipText)}</span></div>`;
  h+=`<div class="next"><h2>Önümüzdeki 7 gün</h2><div class="next-list">`;
  h+=upcoming.length?upcoming.map(i=>`<div class="next-row ${i.date<today?"late":""}"><span><span class="d">${i.date<today?"Gecikti":dlabel(i.date)}</span> ${esc(i.label)}</span><b class="${i.kind}">${i.kind==="in"?"+":"−"}${fmt(i.amount)}</b></div>`).join(""):`<div class="next-row"><span>Bu hafta bekleyen kalem yok.</span></div>`;
  h+=`</div><div class="bar" aria-label="İlerleme yüzde ${pct}"><i style="width:${pct}%"></i></div><div class="stats"><span>Tamamlanan <b>${items.filter(i=>done.has(i.id)).length}/${items.length}</b></span><span>Gelen <b>${fmt(sum(ins.filter(i=>done.has(i.id))))}</b> / ${fmt(sum(ins))}</span><span>Ödenen <b>${fmt(sum(outs.filter(i=>done.has(i.id))))}</b> / ${fmt(sum(outs))}</span></div></div>`;
  h+=`<div class="views" role="tablist" aria-label="Görünüm"><button type="button" role="tab" id="v-plan" data-view="plan" aria-selected="${view==="plan"}">Plan</button><button type="button" role="tab" id="v-cards" data-view="cards" aria-selected="${view==="cards"}">Kartlar</button><button type="button" role="tab" id="v-loans" data-view="loans" aria-selected="${view==="loans"}">Krediler</button><button type="button" role="tab" id="v-chart" data-view="chart" aria-selected="${view==="chart"}">Çizelge</button><button type="button" role="tab" id="v-status" data-view="status" aria-selected="${view==="status"}">Durum</button></div>`;
  if(view==="cards"){h+=renderCards(items);app.innerHTML=h;return}
  if(view==="loans"){h+=renderLoans(items);app.innerHTML=h;return}
  if(view==="chart"){h+=renderChart(items);app.innerHTML=h;return}
  if(view==="status"){h+=renderStatus(items);app.innerHTML=h;return}
  h+=`<div class="actions"><button type="button" class="btn add-out" id="open-out" data-open="out"><span class="dot"></span>Ödeme ekle</button><button type="button" class="btn add-in" id="open-in" data-open="in"><span class="dot"></span>Gelir ekle</button></div>`;
  if(panel)h+=renderPanel();
  // tabs
  h+=`<div class="tabs" role="tablist" aria-label="Aylar">`;
  for(const m of months){const a=items.filter(i=>i.date.startsWith(m));const dn=a.filter(i=>done.has(i.id)).length;
    h+=`<button type="button" role="tab" class="tab" id="tab-${m}" data-m="${m}" aria-selected="${month===m}">${mlabel(m)}<small>${dn}/${a.length}</small></button>`}
  h+=`<button type="button" role="tab" class="tab" id="tab-all" data-m="all" aria-selected="${month==="all"}">Tümü<small>${items.length}</small></button></div>`;
  h+=`<div class="filters" role="group" aria-label="Filtre">${[["all","Hepsi"],["open","Bekleyen"],["in","Gelirler"],["out","Ödemeler"]].map(([k,t])=>`<button type="button" class="pill" id="f-${k}" data-f="${k}" aria-pressed="${filter===k}">${t}</button>`).join("")}</div>`;
  h+=`<p class="hint">Sırasını değiştirmek için kalemi basılı tut ve yukarı ya da aşağı sürükle.</p>`;
  const vis=[];
  // Cash and usable limit after each row (card limit + free Garanti ek hesap while it is open)
  const run=runCalc(items);
  const shown=month==="all"?months:[month];
  for(const mk of shown){
    const all=items.filter(i=>i.date.startsWith(mk));
    const rows=all.filter(i=>filter==="all"||(filter==="open"&&!done.has(i.id))||(filter==="in"&&i.kind==="in")||(filter==="out"&&i.kind!=="in"));
    const mi=sum(all.filter(i=>i.kind==="in")), mo=sum(all.filter(i=>i.kind==="out")), mc=sum(all.filter(i=>i.kind==="card"));
    h+=`<section class="month">`;
    if(month==="all")h+=`<div class="mhead"><h3>${mlabel(mk)}</h3><span>${all.filter(i=>done.has(i.id)).length}/${all.length} tamam</span></div>`;
    else h+=`<div class="msum"><span>Gelir <b class="in">+${fmt(mi)}</b></span><span>Nakit ödeme <b class="out">−${fmt(mo)}</b></span><span>Kartla <b>${fmt(mc)}</b></span><span>Fark <b>${mi-mo>=0?"+":"−"}${fmt(Math.abs(mi-mo))}</b></span></div>`;
    if(!rows.length)h+=`<p class="empty">${filter==="open"?"Bu ayın hepsi tamam.":"Bu filtrede kalem yok."}</p>`;
    else h+=`<div class="rhead" aria-hidden="true"><span></span><span>Tarih</span><span>Kalem</span><span class="r">Tutar</span><span class="r">Nakit</span><span class="r">Limit</span></div>`;
    rows.forEach(i=>vis.push(i.id));
    for(const i of rows){
      if(editId===i.id){h+=renderEdit(i);continue}
      const isDone=done.has(i.id), late=!isDone&&i.date<today, isToday=!isDone&&i.date===today;
      const tags=(i.kind==="card"?`<span class="tag card">Kart</span>`:"")+(i.est?`<span class="tag est">Tahmini</span>`:"")+(late?`<span class="tag late">Gecikti</span>`:"")+(isToday?`<span class="tag today">Bugün</span>`:"")+(i.short>0?`<span class="tag late">Eksik ${fmt(i.short)}</span>`:"")+(i.mine?`<span class="tag mine">Eklediğin</span>`:"");
      const del=i.mine?`<button type="button" class="del" id="del-${i.id}" data-del="${i.g}">${i.n>1?"Seriyi sil":"Sil"}</button>`:"";
      const ops=`<span class="ops"><span class="mv" role="group" aria-label="${esc(i.label)} sırası"><button type="button" id="up-${i.id}" data-mv="up" data-mid="${i.id}" aria-label="Yukarı taşı"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5 6 4l3.5 3.5"/></svg></button><button type="button" id="dn-${i.id}" data-mv="down" data-mid="${i.id}" aria-label="Aşağı taşı"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button></span><button type="button" class="del" id="ed-${i.id}" data-edit="${i.id}">Düzenle</button>${del}</span>`;
      h+=`<label class="row ${i.kind} ${isDone?"done":""} ${flashId===i.id?"flash":""} ${run[i.id].bal<0?"ek":""}" for="c-${i.id}" data-row="${i.id}"><input type="checkbox" id="c-${i.id}" data-id="${i.id}" ${isDone?"checked":""}><span class="date">${dlabel(i.date)}</span><span class="what"><span class="lbl">${esc(i.label)}</span>${tags}${i.note?`<span class="note">${esc(i.note)}</span>`:""}</span><span class="right"><span class="amt">${i.kind==="in"?"+":"−"}${fmt(i.amount)}</span>${ops}</span><span class="num c ${run[i.id].bal<0?"neg":""}" title="Bu satırdan sonra nakit">${kf(run[i.id].bal)}</span><span class="num" title="Bu satırdan sonra kullanılabilir limit">${kf(run[i.id].lim)}</span></label>`;
    }
    h+=`</section>`;
  }
  app.dataset.vis=vis.join(",");

function seriesDates(start,every,c){const out=[];for(let k=0;k<c;k++)out.push(every==="week"?addDays(start,7*k):every==="2week"?addDays(start,14*k):addMonths(start,k));return out}
// Turns the expense form into dated occurrences (no ids yet); null while the form is incomplete
function buildOcc(f){

  if(f.type==="loan"){
    const P=+f.principal,r=+String(f.rate).replace(",","."),n=Math.round(+f.n);
    if(!(P>0)||isNaN(r)||!(n>=1)||!f.date)return null;
    const L=loan(P,r,n,f.tax);
    const note=`%${String(r).replace(".",",")} faiz, ${n} ay`+(f.tax?", vergiler dahil":"")+(f.note?" · "+f.note.trim():"");
    const occ=seriesDates(f.date,"month",n).map((d,k)=>({date:d,label:`${name} taksit ${k+1}/${n}`,amount:Math.round(L.pay),note,est:false}));
    let pre=[];
    if(f.addin&&f.indate)pre=[{date:f.indate,kind:"in",label:name,amount:P-(+f.fee||0),note:+f.fee>0?"Tahsis ücreti düşülmüş":"Kredi tutarı",ord:4999}];
    return {occ,cardable:false,pre};
  }
  const a=+f.amount;if(!(a>0)||!f.date)return null;
  const note=(f.note||"").trim();
  if(f.type==="repeat"){const c=Math.round(+f.count);if(!(c>=1))return null;
    return {occ:seriesDates(f.date,f.every||"month",c).map((d,k)=>({date:d,label:c>1?`${name} (${k+1}/${c})`:name,amount:a,note,est:!!f.est})),cardable:!f.nocard,pre:[]}}
  return {occ:[{date:f.date,label:name,amount:a,note,est:!!f.est}],cardable:!f.nocard,pre:[]};
}
function simulate(p){
  const saved=custom;custom=custom.concat(p.pre.map(x=>Object.assign({},x)));
  try{return planRows(p.occ,p.cardable)}finally{custom=saved}
}
function decisionPreview(p){
  const rows=simulate(p),s=summarize(rows),many=p.occ.length>1;
  let head;
  if(s.short>0)head=`Eksik kalıyor: ${fmt(s.short)}`;
  else if(s.card<=0)head="Nakitten ödenecek";
  else if(s.cash<=0)head="Kartla ödenecek";
  else head="Nakit + kart olarak bölünecek";
  let h=`<div class="preview f full" id="auto-preview"><span class="muted">Otomatik karar</span><b>${head}</b>`;
  h+=`<span>Nakit ${fmt(s.cash)} · Kart ${fmt(s.card)}${s.short>0?` · Eksik ${fmt(s.short)}`:""}</span>`;
  if(!many){const h0=headroom(p.occ[0].date,allItems().concat(p.pre));h+=`<span class="muted">${dlabel(p.occ[0].date)} sonrası boşta kalan: nakit ${fmt(h0.cash)}, kart limiti ${fmt(h0.lim)}</span>`}

  if(!p.cardable&&s.short>0)h+=`<span class="muted">Bu ödeme kartla yapılamadığı için eksik kısım için ek kaynak gerekir.</span>`;
  else if(s.short>0)h+=`<span class="muted">Nakit ve kart limiti o dönemde yetmiyor; tarihi ileri almayı dene.</span>`;
  return h+`</div>`;
}

  h+=`<p class="foot">Kart borçları ekstre yüklediğin günden itibaren hesaplanır: o günkü borç, sonra plandaki harcamalar eklenir, ödemeler düşülür. Faiz ayrıca eklenmez; kapanış tahminleri faizi ve yeni eklenen taksitleri karşılayacak kadar yüksek tutulduğu için aradaki fark ayrıca gösterilir. Ödendi işaretlediğin kalemler bugün yapılmış sayılır. Garanti'de borç, kalan ödemelerin toplamıdır.</p>`;

// ---------- confirm before changing ----------
// Every add, edit, delete and date move is first tried on a copy: the page shows what it does to cash,
// the tightest day, the ek hesap and card limits, and only applies it if the person goes ahead.
let confirmOpen=false,confirmChain=Promise.resolve();
const snapState=()=>JSON.stringify({custom,edits,loans,done:[...done]});
function restoreState(x){const o=JSON.parse(x);custom=o.custom;edits=o.edits;loans=o.loans;done=new Set(o.done)}
function metrics(){
  const items=allItems(),run=runCalc(items,true),pend=items.filter(i=>!settled(i));
  let gap=0,gapDay=null,minS=Infinity,minI=null,ek=0,ekDay=null,cardMin=Infinity,cardDay=null;const gd=new Set();
  for(const i of pend){const r=run[i.id],sl=r.bal-r.fl;
    if(sl<minS){minS=sl;minI=i}
    if(sl<0){gd.add(i.date);if(-sl>gap){gap=-sl;gapDay=i.date}}
    if(r.fl<0&&Math.min(-r.bal,EK_HESAP)>ek){ek=Math.min(-r.bal,EK_HESAP);ekDay=i.date}
    if(r.card<cardMin){cardMin=r.card;cardDay=i.date}}
  const end=items.reduce((a,i)=>a+cashEff(i),0);
  return {gap,gapDay,gapDays:gd.size,minS,minI,ek,ekDay,cardMin,cardDay,end,endDate:items.length?items[items.length-1].date:today};
}
function impactLines(b,a){
  const L=[];const sg=v=>(v>=0?"+":"−")+fmt(Math.abs(v));
  if(a.gap>0){L.push({c:"bad",t:`${dlabel(a.gapDay)} günü ${fmt(a.gap)} açık oluşur${a.gapDays>1?` (toplam ${a.gapDays} gün açıkta kalırsın)`:""}; o gün ek hesap da yetmez, para bulman gerekir.`+(b.gap>0?` Şu an: ${fmt(b.gap)}.`:"")})}
  else if(b.gap>0)L.push({c:"good",t:`Açık kapanıyor (şu an ${dlabel(b.gapDay)} günü ${fmt(b.gap)} açık var).`});
  const d=a.end-b.end;
  if(Math.abs(d)>=1)L.push({c:d<0?"warn":"good",t:`${dlabel(a.endDate)} sonunda nakit: ${fmt(b.end)} → ${fmt(a.end)} (${sg(d)})`});
  if(a.gap<=0&&a.minI&&b.minI&&(Math.abs(a.minS-b.minS)>=1||a.minI.date!==b.minI.date))L.push({c:a.minS<1000?"warn":"",t:`En dar gün: ${dlabel(b.minI.date)} (${fmt(Math.max(0,b.minS))} pay) → ${dlabel(a.minI.date)} (${fmt(Math.max(0,a.minS))} pay)`});
  if(Math.abs(a.ek-b.ek)>=1)L.push({c:a.ek>=EK_HESAP*0.9?"warn":"",t:`Ek hesaptan en fazla: ${fmt(b.ek)} → ${fmt(a.ek)}${a.ekDay?` (${dlabel(a.ekDay)})`:""}${a.ek>=EK_HESAP?" · limitin tamamı":""}`});
  if(a.cardMin<-1&&a.cardMin<b.cardMin-1)L.push({c:"bad",t:`Kart limitleri ${dlabel(a.cardDay)} günü ${fmt(-a.cardMin)} aşılıyor.`});
  else if(b.cardMin<-1&&a.cardMin>=-1)L.push({c:"good",t:"Kart limiti aşımı kalkıyor."});
  if(!L.length)L.push({c:"",t:"Nakit, ek hesap ve kart limitleri değişmiyor."});
  return L;
}
const itemLine2=x=>`${dlabel(x.date)} · ${x.label} · ${x.kind==="in"?"+":"−"}${fmt(x.amount)}${x.kind==="card"?" (kart)":""}`;
function listLines(arr,max){const out=arr.slice(0,max||4).map(itemLine2);if(arr.length>(max||4))out.push(`… ve ${arr.length-(max||4)} kalem daha`);return out}
// Resolves true after the person confirms (and mutate has run), false if they back out
function confirmChange(o){
  const run=()=>new Promise(res=>{
    const s0=snapState();const b=metrics();let a;
    try{o.mutate();a=metrics()}finally{restoreState(s0)}
    const imp=impactLines(b,a),bad=imp.some(x=>x.c==="bad");
    const back=document.createElement("div");back.className="cf-back";
    back.innerHTML=`<div class="cf" role="dialog" aria-modal="true" aria-labelledby="cf-t"><h2 id="cf-t">${esc(o.title)}</h2>${o.what&&o.what.length?`<div><h3>Değişiklik</h3><ul>${o.what.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}<div><h3>Neye yol açar</h3><ul>${imp.map(x=>`<li class="${x.c}">${esc(x.t)}</li>`).join("")}</ul></div>${o.from?`<p class="foot" style="margin:0">${esc(o.from)}</p>`:""}<div class="acts2"><button type="button" class="btn" id="cf-no">Vazgeç</button><button type="button" class="btn ${bad?"go-bad":"primary"}" id="cf-yes">${bad?"Yine de devam et":"Devam et"}</button></div></div>`;
    const prevFocus=document.activeElement;confirmOpen=true;document.body.appendChild(back);
    const done_=ok=>{back.remove();confirmOpen=false;document.removeEventListener("keydown",key,true);if(ok)o.mutate();res(ok);try{if(prevFocus&&prevFocus.isConnected)prevFocus.focus({preventScroll:true})}catch(_){}};
    const key=e=>{if(e.key==="Escape"){e.preventDefault();e.stopPropagation();done_(false)}else if(e.key==="Tab"){const f=[...back.querySelectorAll("button")];const k=f.indexOf(document.activeElement);if(e.shiftKey&&k<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&k===f.length-1){e.preventDefault();f[0].focus()}}};
    document.addEventListener("keydown",key,true);
    back.addEventListener("click",e=>{if(e.target===back)done_(false)});
    back.querySelector("#cf-no").onclick=()=>done_(false);
    back.querySelector("#cf-yes").onclick=()=>done_(true);
    back.querySelector(bad?"#cf-no":"#cf-yes").focus();
  });
  const p=confirmChain.then(run);confirmChain=p.catch(()=>{});return p;
}

  for(const m of loans){const its=items.filter(i=>i.g===m.g);

async function sendChat(text){
  text=String(text||"").trim();if(!text||chatBusy||!sampleFn)return;
  if(!chatLimits){try{chatLimits=await sampleFn.limits()}catch(_){chatLimits={}}}
  chat.push({role:"user",content:text});
  const m={role:"assistant",content:"",status:"Düşünüyor…",acts:[]};chat.push(m);
  chatDraft="";const ta=document.getElementById("chat-in");if(ta)ta.value="";
  const snap=JSON.stringify({done:[...done],custom,edits,loans});
  const ctl2=new AbortController();chatBusy=ctl2;renderChat();
  const turns=chat.filter(x=>(x.role==="user"||x.role==="assistant")&&x!==m&&(x.content||"").trim()).slice(-12).map(x=>({role:x.role,content:x.content}));
  while(turns.length&&turns[0].role!=="user")turns.shift();
  const input=[{role:"user",content:rules()},...turns];
  const opts={signal:ctl2.signal,cache:false,onText:({text})=>{m.content=text;renderChat()}};
  if(chatLimits&&chatLimits.tools){delete opts.cache;opts.tools=chatTools(m.acts)}
  try{const r=await sampleFn(input,opts);m.content=r.text;if(r.truncated)m.content+="\n\n(Cevap yarıda kesildi.)"}
  catch(e){const c=e&&e.code;m.content=e&&e.text||"";
    if(c!=="cancelled")chat.push({role:"error",content:{not_granted:"Claude'a izin verilmedi.",rate_limited:"Şu an çok fazla istek var; biraz sonra tekrar dene.",session_expired:"Oturumun kapanmış; yeniden giriş yap.",refused:"Claude bu isteğe cevap vermedi.",prompt_too_large:"Sohbet çok uzadı; Yeni sohbet başlat.",sampling_disabled:"Bu hesapta Claude kullanılamıyor.",tools_unavailable:"Bu görünümde değişiklik yapılamıyor."}[c]||"Bir sorun oldu; tekrar dene."});
    if(c==="not_granted"||c==="sampling_disabled"){chatBusy=null;keepChat();renderChat();return}}
  finally{if(chatBusy===ctl2)chatBusy=null}
  if(!m.content&&!m.acts.length)chat.splice(chat.indexOf(m),1);
  if(m.acts.length){m.snap=snap;schedule()}
  delete m.status;keepChat();renderChat();
  const t=document.getElementById("chat-in");if(t&&window.matchMedia("(hover:hover)").matches)t.focus();
}
function undoChat(k){
  const m=chat[k];if(!m||!m.snap||m.undone)return;
  try{const s=JSON.parse(m.snap);done=new Set(s.done||[]);custom=s.custom||[];edits=s.edits||{};loans=s.loans||[]}catch(_){return}
  m.undone=true;chat.forEach((x,j)=>{if(j>k&&x.snap)x.undone=true});
  keepChat();writeStash();render();renderChat();schedule();
}

function readForm(){
  const el=document.getElementById("add-form");if(!el)return;
  for(const inp of el.querySelectorAll("input,select")){if(!inp.name)continue;form[inp.name]=inp.type==="checkbox"?inp.checked:inp.value}

function submitForm(){
  readForm();const f=form,isOut=panel==="out";
  const name=(f.name||"").trim();
  const g="g"+Date.now().toString(36);const add=[];
  const push=(date,kind,label,amount,note,est)=>add.push({id:g+"-"+add.length,g,date,kind,label,amount:Math.round(amount*100)/100,note,est:!!est});
  if(isOut){
    if(!name)return fail(f.type==="loan"?"Krediye bir ad ver.":"Ödemeye bir ad ver.");
    if(f.type==="loan"){
      const r=+String(f.rate).replace(",",".");
      if(!(+f.principal>0))return fail("Çekilen tutarı yaz.");
      if(isNaN(r)||r<0)return fail("Aylık faiz oranını yaz (faizsizse 0).");
      if(!(Math.round(+f.n)>=1))return fail("Vadeyi ay olarak yaz.");
      if(!f.date)return fail("İlk taksit tarihini seç.");
      if(f.addin&&!f.indate)return fail("Kredinin hesaba yattığı günü seç.");
    }else{
      if(!(+f.amount>0))return fail("Tutarı yaz.");
      if(!f.date)return fail("Tarihi seç.");
      if(f.type==="repeat"&&!(Math.round(+f.count)>=1))return fail("Kaç kez tekrarlanacağını yaz.");
    }
    const p=buildOcc(f);if(!p)return fail("Eksik alan var.");
    p.pre.forEach(x=>push(x.date,"in",x.label,x.amount,x.note,false));
    custom=custom.concat(add.map(x=>Object.assign({},x)));      // income first, so the simulation sees it
    const rows=simulate({occ:p.occ,cardable:p.cardable,pre:[]});
    custom=custom.slice(0,custom.length-add.length);
    rows.forEach(r=>{const x={id:g+"-"+add.length,g,date:r.date,kind:r.kind,label:r.label,amount:Math.round(r.amount*100)/100,note:r.note,est:!!r.est};if(r.lim!=null)x.lim=r.lim;if(r.short)x.short=r.short;add.push(x)});
  }else{
    const a=+f.amount;
    if(!name)return fail("Gelire bir ad ver.");
    if(!(a>0))return fail("Tutarı yaz.");
    if(!f.date)return fail("Tarihi seç.");
    const note=(f.note||"").trim();
    if(f.type==="repeat"){const c=Math.round(+f.count);if(!(c>=1))return fail("Kaç kez tekrarlanacağını yaz.");
      seriesDates(f.date,f.every||"month",c).forEach((d,k)=>push(d,"in",c>1?`${name} (${k+1}/${c})`:name,a,note,f.est))}
    else push(f.date,"in",name,a,note,f.est);
  }
  add.forEach(x=>x.n=add.filter(y=>y.kind===x.kind).length);
  const loanRow=isOut&&f.type==="loan"?{g,name,principal:+f.principal,rate:+String(f.rate).replace(",","."),n:Math.round(+f.n),tax:!!f.tax}:null;
  confirmChange({title:add.length>1?`${add.length} kalem eklenecek`:"Kalem eklenecek",what:listLines(add),mutate:()=>{custom=custom.concat(add.map(x=>Object.assign({},x)));if(loanRow)loans=loans.concat([Object.assign({},loanRow)])}}).then(ok=>{
  if(!ok)return;
  if(view==="plan")month=add[0].date.slice(0,7);panel=null;form={};
  writeStash();render();schedule();
  const t=document.getElementById("tab-"+month);if(t)t.scrollIntoView({block:"nearest",inline:"center"});
  });
}

  if(t.dataset.edel){readEdit();const id=editId;const it=allItems().find(x=>x.id===id);if(!it)return;
    confirmChange({title:`${it.label} silinecek`,what:[itemLine2(it)],mutate:()=>removeItem(id)}).then(ok=>{if(!ok)return;editId=null;editForm={};editDel=false;writeStash();render();schedule();toast(`${it.label} silindi`)});return}
  if(t.dataset.newloan){panel="out";form={type:"loan",every:"month",tax:true,addin:true};render();const n=document.getElementById("fld-name");if(n)n.focus();return}
  if(t.dataset.ext){const L=allLoans(allItems()).find(x=>x.key===t.dataset.ext);const inp=document.getElementById("ext-"+t.dataset.ext);const c=Math.round(+(inp&&inp.value));
    if(L&&c>=1&&c<=60){const last=L.inst[L.inst.length-1];const g=L.custom?L.custom.g:"x-"+L.key;const add=[];
      for(let k=1;k<=c;k++)add.push({id:g+"-e"+Date.now().toString(36)+k,g,date:addMonths(last.date,k),kind:"out",label:L.label,amount:last.amount,note:"Eklenen taksit",est:false});
      confirmChange({title:`${L.name}: ${c} taksit eklenecek`,what:listLines(add),mutate:()=>{custom=custom.concat(add.map(x=>Object.assign({},x)))}}).then(ok=>{if(ok){writeStash();render();schedule()}})}return}
  if(t.dataset.tlpast){chartPast=!chartPast;render();return}
  if(t.dataset.view){view=t.dataset.view;try{localStorage.setItem("odeme-view",view)}catch(_){}render();return}
  if(t.dataset.ctab){cardTab=t.dataset.ctab;cardDel=null;try{localStorage.setItem("odeme-card",cardTab)}catch(_){}render();return}
  if(t.dataset.pick){const inp=document.getElementById("file-"+t.dataset.pick);if(inp)inp.click();return}
  if(t.dataset.stop){if(ctl)ctl.abort();else{busy=null;render()}return}
  if(t.dataset.cdel){if(cardDel!==t.dataset.cdel){cardDel=t.dataset.cdel;render();return}delete cards[cardDel];cardDel=null;writeStash();render();schedule();return}
  if(t.dataset.pwok){const pw=document.getElementById("pdf-pw");if(busy&&busy.file&&pw&&pw.value){const f=busy.file,id=busy.id;handleFile(id,f,pw.value)}return}
  if(t.dataset.open){editId=null;panel=t.dataset.open;form={type:"once",every:"month",tax:true};render();const n=document.getElementById("fld-name");if(n)n.focus();return}
  if(t.dataset.cancel){panel=null;form={};render();return}
  if(t.dataset.kind){readForm();form.type=t.dataset.kind;form.err="";render();return}
  if(t.dataset.pay){readForm();form.pay=t.dataset.pay;render();return}
  if(t.dataset.m){month=t.dataset.m;try{localStorage.setItem("odeme-month",month)}catch(_){}render();return}
  if(t.dataset.f){filter=t.dataset.f;try{localStorage.setItem("odeme-filter",filter)}catch(_){}render();return}
  if(t.dataset.del){e.preventDefault();e.stopPropagation();const g=t.dataset.del;
    const grp=allItems().filter(c=>c.g===g);const ln=loans.find(l=>l.g===g);
    confirmChange({title:ln?`${ln.name} kredisi silinecek`:grp.length>1?`${grp.length} kalemlik seri silinecek`:"Kalem silinecek",what:listLines(grp),mutate:()=>{grp.forEach(i=>done.delete(i.id));custom=custom.filter(c=>c.g!==g);loans=loans.filter(l=>l.g!==g)}}).then(ok=>{delArm=null;if(ok){writeStash();render();schedule()}else render()});return}
});
try{const f=localStorage.getItem("odeme-filter");if(f)filter=f;const m=localStorage.getItem("odeme-month");if(m)month=m;const v=localStorage.getItem("odeme-view");if(["cards","plan","loans","chart","status"].includes(v))view=v;const c=localStorage.getItem("odeme-card");if(c)cardTab=c}catch(e){}

// ---------- calendar and backup (standalone app) ----------
function icsText(){
  const items=allItems(),run=runCalc(items,true),pad2=n=>String(n).padStart(2,"0");
  const now=new Date(),stamp=now.getUTCFullYear()+pad2(now.getUTCMonth()+1)+pad2(now.getUTCDate())+"T"+pad2(now.getUTCHours())+pad2(now.getUTCMinutes())+"00Z";
  const escI=t=>String(t).replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Odeme Plani//TR","CALSCALE:GREGORIAN","X-WR-CALNAME:Ödeme Planı"];
  for(const i of items){if(i.kind!=="out"||settled(i)||/yemek|spor|protein/i.test(i.label))continue;
    const d=i.date.replace(/-/g,""),nx=addDays(i.date,1).replace(/-/g,""),r=run[i.id];
    L.push("BEGIN:VEVENT","UID:"+i.id+"-"+d+"@odeme-plani","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+nx,
      "SUMMARY:"+escI(`${i.kind==="card"?"Kartla":"Ödeme"}: ${i.label} · ${fmt(i.amount)}`),
      "DESCRIPTION:"+escI(`${i.note?i.note+"\n":""}Bu ödemeden sonra plandaki nakit: ${fmt(r.bal)}`),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+escI(`Yarın: ${i.label} ${fmt(i.amount)}`),"TRIGGER:-PT15H","END:VALARM",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+escI(`Bugün: ${i.label} ${fmt(i.amount)}`),"TRIGGER:PT9H","END:VALARM","END:VEVENT")}
  L.push("END:VCALENDAR");return L.join("\r\n")+"\r\n";
}
window.__icsText=icsText;
function saveBlob(name,type,text){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
app.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.dataset.ics){saveBlob("odeme-plani.ics","text/calendar",icsText());toast("Takvim dosyası hazır; açıp Takvim'e ekle")}
  else if(t.dataset.exp){saveBlob("odeme-yedek-"+today+".json","application/json",JSON.stringify({v:2,base:BASE,done:[...done],custom,cards,loans,edits}))}
  else if(t.dataset.imp){const f=document.getElementById("imp-file");if(f)f.click()}});
app.addEventListener("change",e=>{if(e.target.id!=="imp-file"||!e.target.files[0])return;const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||!Array.isArray(o.done))throw 0;
  if(Array.isArray(o.base))BASE=o.base;done=new Set(o.done);custom=o.custom||[];cards=o.cards||{};loans=o.loans||[];edits=o.edits||{};writeStash();render();toast("Yedek geri yüklendi")}catch(_){toast("Bu dosya bir yedek değil")}};fr.readAsText(e.target.files[0])});
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});

// ---------- saving ----------
function setChip(m,t){mode=m;chipText=t;const c=document.getElementById("chip");if(c){c.className="chip "+m;c.textContent=t}}
function schedule(){
  if(mode==="local"){setChip("local","Telefonda kayıtlı");return}
  setChip("busy","Kaydediliyor…");clearTimeout(timer);timer=setTimeout(save,2500);
}
function buildDoc(){
  const css=document.getElementById("app-style").textContent;
  const js=document.getElementById("app-script").textContent;
  const data=JSON.stringify({done:[...done],custom,cards,loans,edits}).replace(/</g,"\\u003c");
  const reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
   +'<title>Ödeme ve Gelir Listesi</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
   +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">\n'
   +'<style id="app-style">'+css+'</style>\n<main class="wrap" id="app"><p class="empty">Liste yükleniyor…</p></main>\n'
   +'<script type="application/json" id="state">'+data+'<\/script>\n<script id="app-script">'+js+'<\/script></body></html>';
}
async function save(){
  if(panel||editId||chatOpen||drag||confirmOpen||(busy&&!busy.err)){clearTimeout(timer);timer=setTimeout(save,4000);return} // a save reloads the page: wait while a form, the chat, a drag or a statement read is in progress
  if(!art){setChip("local","Telefonda kayıtlı");return}
  try{writeStash();await art.publish(buildDoc());setChip("ok","Kaydedildi")}
  catch(err){const c=err&&err.code;
    if(c==="conflict")setChip("busy","Yeni sürüm yükleniyor…");
    else if(c==="rate_limited"||c==="upstream_error"){setChip("busy","Biraz sonra kaydedilecek");clearTimeout(timer);timer=setTimeout(save,8000)}
    else setChip("local","Telefonda kayıtlı")}
}

render();
(async()=>{
  try{art=window.claude&&window.claude.use?await window.claude.use("artifact"):null}catch(e){art=null}
  try{sampleFn=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(e){sampleFn=null}
  sampleChecked=true;if(view==="cards")render();renderChat();
  const st=readStash();
  if(!art){mode="local";if(st){if(Array.isArray(st.base))BASE=st.base;done=new Set(st.done||[]);custom=st.custom||custom;cards=st.cards||cards;loans=st.loans||loans;edits=st.edits||edits}setChip("local","Telefonda kayıtlı");render();return}
  if(st&&!sameState(st,{done:[...done],custom,cards,loans,edits})){done=new Set(st.done||[]);custom=st.custom||[];cards=st.cards||{};loans=st.loans||[];edits=st.edits||{};render();schedule()}
  else{clearStash();setChip("ok","Kaydedildi")}
})();
})();
